<!--
LUXVEN CAREERS - ALL IN ONE FILE
Ei ekta file-i shob. Netlify-te eta "index.html" naam diye upload koro.

SETUP (shudhu ekbar):
1. console.firebase.google.com -> Create project -> Add Web app -> config copy kore niche CFG-te boshao.
2. Authentication -> Email/Password enable -> Users -> Add user: tomar OWNER email + password (eta main admin).
3. Firestore Database -> Create -> Rules tab-e niche "FIRESTORE RULES" paste kore Publish koro.
4. Firebase Storage lagbe na (free thakbe). CV ar poster image Firestore-ei save hoy.
5. Rules-e AND niche script-er OWNER-e luxven_job@luxven.com bodle tomar OWNER email dao (duita jaygay same email).
6. Authentication -> Settings -> Authorized domains-e Netlify domain add koro.
7. GitHub repo-te ei file upload -> Netlify "Import from GitHub" -> publish directory "." -> Deploy.
8. yoursite.netlify.app/#/admin -> OWNER email diye login -> Staff tab theke notun admin/moderator banao.

ROLES:
- Owner/Admin: shob kichu (jobs, promo, settings, staff, shob application, delete).
- Moderator: job dekhte parbe, application dekhte parbe, Under Review / Shortlisted / Interview / Rejected korte parbe. Selected, delete, settings, promo, staff parbe na.
- Moderator-er Rejected application admin abar dekhte o change korte parbe. Rejected application 10 din por auto delete (CV shoho), jokhon kono admin panel kholbe.

===== FIRESTORE RULES =====
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signed() { return request.auth != null; }
    function owner() { return signed() && request.auth.token.email == 'luxven_job@luxven.com'; }  // CHANGE
    function sdoc() { return /databases/$(database)/documents/staff/$(request.auth.uid); }
    function admin() { return owner() || (signed() && exists(sdoc()) && get(sdoc()).data.role == 'admin'); }
    function mod() { return signed() && exists(sdoc()) && get(sdoc()).data.role == 'moderator'; }
    function staff() { return admin() || mod(); }
    function modOpen(r) { return r.data.status in ['Application Received','Under Review','Shortlisted','Interview']; }
    function modNew(r) { return r.data.status in ['Under Review','Shortlisted','Interview','Rejected']; }

    match /staff/{u} {
      allow get: if signed() && (request.auth.uid == u || admin());
      allow list: if admin();
      allow write: if admin();
    }
    match /settings/{d} { allow read: if true; allow write: if admin(); }
    match /promos/{d} { allow read: if true; allow write: if admin(); }
    match /jobs/{d} {
      allow get: if resource.data.status in ['published','closed'] || staff();
      allow list: if staff() || resource.data.status in ['published','closed'];
      allow write: if admin();
    }
    match /applications/{id} {
      allow create: if id.matches('LX-[0-9]{4}-[0-9]{5}')
        && request.resource.data.name is string && request.resource.data.name.size() > 1 && request.resource.data.name.size() < 100
        && request.resource.data.phone.matches('01[0-9]{9}') && request.resource.data.whatsapp.matches('01[0-9]{9}')
        && request.resource.data.status == 'Application Received'
        && request.resource.data.cvPath.matches('cv/.*');
      allow read: if staff();
      allow update: if admin() || (mod() && modOpen(resource) && modNew(request.resource)
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','reasonSel','reasonOther','interview','notes','rejectedAt','rejectedBy']));
      allow delete: if admin();
    }
    match /tracking/{id} {
      allow get: if true;
      allow create: if id.matches('LX-[0-9]{4}-[0-9]{5}') && request.resource.data.status == 'Application Received';
      allow update: if admin() || (mod() && modOpen(resource) && modNew(request.resource)
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','reason','interview']));
      allow delete: if admin();
    }
    match /counters/{y} {
      allow get: if true;
      allow create: if request.resource.data.n == 1;
      allow update: if request.resource.data.n == resource.data.n + 1;
    }
    match /cvs/{id} {
      allow create: if request.resource.data.keys().hasOnly(['data','name','type','at']) && request.resource.data.data is string && request.resource.data.data.size() < 1000000;
      allow read: if staff();
      allow delete: if admin();
    }
    match /dup/{k} { allow get: if true; allow create: if true; }
  }
}

-->
